[project]
name = "frappe_pm"
authors = [{ name = "Frappe PM Contributors", email = "noreply@example.com" }]
description = "Project management for Frappe: projects, tasks, agile boards, time tracking, resources, budgets and reporting."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501", "E731"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
